<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Знакомства КГ</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111111;
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: center;
    }

    .logo {
      font-size: 64px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 32px;
      margin: 0 0 15px;
    }

    p {
      color: #aaaaaa;
      line-height: 1.5;
      font-size: 16px;
      margin-bottom: 30px;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 17px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      background: #ffffff;
      color: #111111;
    }

    .small {
      margin-top: 15px;
      font-size: 13px;
      color: #777777;
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="logo">❤️</div>

    <h1>Знакомства КГ</h1>

    <p>
      Знакомства для своих.<br>
      Найди кого-нибудь из тусовки
      Китай-города.
    </p>

    <button onclick="startApp()">
      Начать знакомства
    </button>

    <div class="small">
      Только для подписчиков Подслушано Китай Город
    </div>

  </div>

  <script>
    function startApp() {
      alert("Скоро здесь появятся анкеты ❤️");
    }
  </script>

</body>
</html>
